name: Linsy UCP Commerce MCP
description: Linsy publishes a live Model Context Protocol endpoint on each of its storefronts as the
  transport for the Universal Commerce Protocol (UCP) shopping service. Agents discover the merchant
  profile at /.well-known/ucp, then call the MCP endpoint over JSON-RPC to search the catalog, build a
  cart, and drive a buyer-approved checkout. This surface is provided by the Shopify platform on Linsy's
  own hosts and origins.
status: published
