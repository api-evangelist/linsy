tools:
- name: search_catalog
  description: Find products matching the buyer's intent.
  source: llms.txt agent flow
- name: create_cart
  description: Create a cart and add the desired items.
  source: llms.txt agent flow
- name: create_checkout
  description: Start the purchase flow for a cart.
  source: llms.txt agent flow
- name: update_checkout
  description: Set the shipping address and shipping method on a checkout.
  source: llms.txt agent flow
- name: complete_checkout
