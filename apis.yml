aid: linsy
name: Linsy
description: 'Linsy (LINSY HOME) is a direct-to-consumer modular furniture brand founded in 2007, selling
  True Modular sofas, sectionals, reclining couches, modular storage cabinets, replacement covers and
  accessories to households in the United States and other markets from U.S. warehouse fulfillment. Linsy
  operates two Shopify storefronts — www.linsyhome.com and linsy.com — and both expose a machine-readable
  agent surface: a published llms.txt/agents.md, a Universal Commerce Protocol (UCP) merchant profile at
  /.well-known/ucp, an MCP endpoint for agent-driven catalog search, cart, checkout and fulfillment, and
  OpenID Connect discovery for Shopify customer accounts. Linsy was surfaced as a portfolio company of
  Hongshan.'
