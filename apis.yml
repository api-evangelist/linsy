apis:
- aid: linsy:linsy-home-ucp
  name: LINSY HOME UCP Commerce API (MCP)
  description: 'The Universal Commerce Protocol (UCP) agent-commerce surface for the LINSY HOME storefront
    (www.linsyhome.com, Shopify shop linsy-home.myshopify.com). Agents discover the merchant profile at
    /.well-known/ucp and call the MCP endpoint over JSON-RPC to search the catalog, look up products,
    create and update carts, start and update a checkout, and complete a purchase with buyer approval.
    Supported UCP versions are 2026-04-08 (latest stable) and 2026-01-23.'
  humanURL: https://www.linsyhome.com/llms.txt
  baseURL: https://www.linsyhome.com/api/ucp/mcp
  tags:
  - Commerce
  - Agentic Commerce
  - MCP
