- aid: linsy:linsy-official-ucp
  name: Linsy Official Store UCP Commerce API (MCP)
  description: 'The Universal Commerce Protocol (UCP) agent-commerce surface for the Linsy official storefront
    (linsy.com, Shopify shop linsyofficial.myshopify.com). Same UCP shopping service and capability set as
    the LINSY HOME store — catalog search and lookup, cart, discount, checkout, fulfillment and order —
    exposed over an MCP endpoint, with its own Shopify customer-account OpenID Connect issuer.'
  humanURL: https://linsy.com/llms.txt
